<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Footprint Settings</title>
  <style>
    body { font-family: sans-serif; max-width: 500px; margin: 20px; color: #333; }
    textarea { width: 100%; height: 150px; font-family: monospace; padding: 8px; margin-top: 8px; }
    button { padding: 10px 15px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    .status { margin-top: 10px; color: #2ecc71; font-weight: bold; }
  </style>
</head>
<body>
  <h2>Custom Tracker Blocklist</h2>
  <p>Enter tracker domains to scan against your history (one per line):</p>
  <textarea id="blocklistInput"></textarea>
  <br><br>
  <button id="saveBtn">Save Preferences</button>
  <div id="status" class="status"></div>

  <script src="options.js"></script>
</body>
</html>
