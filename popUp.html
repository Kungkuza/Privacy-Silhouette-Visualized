<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 10px;
      background-color: #f9f9f9;
      color: #333;
    }
    .score-container {
      text-align: center;
      margin: 20px 0;
    }
    .score {
      font-size: 48px;
      font-weight: bold;
      color: #e74c3c; /* Starts red/low */
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #eee;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #2980b9; }
  </style>
</head>
<body>
  <h3>Privacy Profile Score</h3>
  <p>An paths-based analysis of your local footprint.</p>
  
  <div class="score-container">
    <div id="scoreDisplay" class="score">--</div>
    <div>Out of 100</div>
  </div>

  <div class="stat-row">
    <span>Tracked History Items:</span>
    <span id="historyCount">0</span>
  </div>
  <div class="stat-row">
    <span>Stored Cookies:</span>
    <span id="cookieCount">0</span>
  </div>
  
  <br>
  <button id="analyzeBtn">Analyze Footprint</button>

  <script src="popup.js"></script>
</body>
</html>
